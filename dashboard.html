<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a73e8">
<title>Dashboard Inventario</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f0f4f8;min-height:100vh;padding-bottom:40px}
header{background:#1a73e8;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100}
header h1{font-size:17px}
#last-update{font-size:11px;opacity:.8}
.toolbar{background:#fff;padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #e0e0e0;position:sticky;top:48px;z-index:99}
.toolbar select{padding:7px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;flex:1;min-width:130px}
.btn-refresh{background:#1a73e8;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}
.kpi{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center}
.kpi .num{font-size:32px;font-weight:bold}
.kpi .lbl{font-size:12px;color:#888;margin-top:2px}
.kpi.ok .num{color:#34a853}
.kpi.warn .num{color:#fbbc04}
.kpi.err .num{color:#ea4335}
.kpi.info .num{color:#1a73e8}
.kpi.purple .num{color:#9c27b0}
section{padding:0 14px 6px}
section h2{font-size:14px;font-weight:bold;color:#333;margin:10px 0 8px}
.bar-wrap{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{width:85px;font-size:12px;color:#444;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-bg{flex:1;background:#f0f0f0;border-radius:6px;height:18px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;transition:width .4s}
.bar-pct{width:34px;font-size:11px;text-align:right;color:#555}
.table-wrap{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.08);overflow:auto;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f8f9fa;padding:9px 10px;text-align:left;color:#555;font-weight:600;border-bottom:1px solid #eee;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:bold;white-space:nowrap}
.tag-ok{background:#e8f5e9;color:#2e7d32}
.tag-diff{background:#fff3e0;color:#e65100}
.tag-miss{background:#fce8e6;color:#c62828}
.tag-extra{background:#e8eaf6;color:#283593}
.loading{text-align:center;padding:50px 20px;color:#aaa;font-size:15px}
.empty-msg{text-align:center;padding:20px;color:#34a853;font-size:13px}
</style>
</head>
<body>

<header>
  <h1>📊 Dashboard Inventario</h1>
  <span id="last-update">—</span>
</header>

<div class="toolbar">
  <select id="filter-device" onchange="render()">
    <option value="all">Todos los dispositivos</option>
  </select>
  <select id="filter-status" onchange="render()">
    <option value="all">Todos los estados</option>
    <option value="ok">✅ OK</option>
    <option value="diff">⚠️ Diferencia</option>
    <option value="miss">❌ No capturada</option>
    <option value="extra">➕ Extra</option>
  </select>
  <button class="btn-refresh" onclick="loadData()">🔄 Actualizar</button>
</div>

<div id="content"><div class="loading">⏳ Conectando con Google Sheets...</div></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbw95dL7cWDdpsuiwbqFo_jf1oDnq4cw3tUMRo-6LjgRuyiW0egJwax6TIQXkKtf5zIrmw/exec';

let baseData = [], captureData = [], analysis = [];

async function loadData() {
  document.getElementById('content').innerHTML = '<div class="loading">⏳ Cargando datos...</div>';
  try {
    const [bRes, cRes] = await Promise.all([
      fetch(API + '?type=base'),
      fetch(API + '?type=captures')
    ]);
    baseData  = await bRes.json();
    captureData = await cRes.json();
    document.getElementById('last-update').textContent = 'Actualizado: ' + new Date().toLocaleTimeString();
    buildDeviceFilter();
    render();
  } catch(err) {
    document.getElementById('content').innerHTML =
      '<div class="loading">❌ Error al conectar.<br><small>' + err.message + '</small></div>';
  }
}

function buildDeviceFilter() {
  const devs = [...new Set(captureData.map(r => r.Dispositivo))].filter(Boolean).sort((a,b)=>a-b);
  const sel = document.getElementById('filter-device');
  sel.innerHTML = '<option value="all">Todos los dispositivos</option>';
  devs.forEach(d => {
    const o = document.createElement('option');
    o.value = d;
    o.textContent = 'Dispositivo ' + String(d).padStart(2,'0');
    sel.appendChild(o);
  });
}

function analyze() {
  const devFilter = document.getElementById('filter-device').value;
  const caps = devFilter === 'all'
    ? captureData
    : captureData.filter(r => String(r.Dispositivo) === String(devFilter));

  // Agrupar capturas por DUN+Ubicacion, sumando cantidades
  const capMap = {};
  caps.forEach(r => {
    const key = String(r.DUN).trim() + '||' + String(r.Ubicacion).trim();
    if (!capMap[key]) capMap[key] = { dun: r.DUN, ubicacion: r.Ubicacion, cantidad: 0, dispositivos: new Set() };
    capMap[key].cantidad += parseFloat(r.Cantidad) || 0;
    capMap[key].dispositivos.add(r.Dispositivo);
  });

  analysis = [];
  const baseKeys = new Set();

  baseData.forEach(b => {
    const dun      = String(b['DUN']  || '').trim();
    const desc     = b['Descripcion'] || '';
    const lote     = b['Lote']        || '';
    const ubic     = String(b['Ubicacion'] || '').trim();
    const cantBase = parseFloat(b['Cantidad'] || 0);
    // Ignorar filas con DUN vacío o "Vacia"
    const dunLow = dun.toLowerCase();
    if (!dun || dunLow === 'vacia' || dunLow === 'vacía' || dunLow === 'vacio') return;

    if (!dun && !ubic) return;
    const key = dun + '||' + ubic;
    baseKeys.add(key);

    const cap = capMap[key];
    let status, diff = 0;
    if (!cap) {
      status = 'miss';
    } else {
      diff = cap.cantidad - cantBase;
      status = diff === 0 ? 'ok' : 'diff';
    }
    analysis.push({
      dun, desc, lote, ubicacion: ubic, cantBase,
      cantCap: cap ? cap.cantidad : 0,
      diff, status,
      dispositivos: cap ? [...cap.dispositivos] : []
    });
  });

  // Extras: en capturas pero no en BASE
  Object.keys(capMap).forEach(key => {
    if (!baseKeys.has(key)) {
      const c = capMap[key];
      analysis.push({
        dun: c.dun, desc: '—', lote: '—', ubicacion: c.ubicacion,
        cantBase: 0, cantCap: c.cantidad, diff: c.cantidad,
        status: 'extra', dispositivos: [...c.dispositivos]
      });
    }
  });
}

function render() {
  analyze();
  const stFilter = document.getElementById('filter-status').value;
  const filtered = stFilter === 'all' ? analysis : analysis.filter(r => r.status === stFilter);

  const total  = analysis.filter(r => r.status !== 'extra').length;
  const ok     = analysis.filter(r => r.status === 'ok').length;
  const diff   = analysis.filter(r => r.status === 'diff').length;
  const miss   = analysis.filter(r => r.status === 'miss').length;
  const extra  = analysis.filter(r => r.status === 'extra').length;
  const pct    = total > 0 ? Math.round(ok / total * 100) : 0;

  // Agrupar por ubicación para barras
  const ubMap = {};
  analysis.forEach(r => {
    if (!ubMap[r.ubicacion]) ubMap[r.ubicacion] = {ok:0,diff:0,miss:0,extra:0,total:0};
    ubMap[r.ubicacion][r.status]++;
    if (r.status !== 'extra') ubMap[r.ubicacion].total++;
  });
  const ubList = Object.entries(ubMap)
    .filter(([,s]) => s.total > 0)
    .sort((a,b) => (a[1].ok/a[1].total) - (b[1].ok/b[1].total));

  // Ubicaciones a recontar
  const recontar = analysis.filter(r => r.status === 'diff' || r.status === 'miss');

  document.getElementById('content').innerHTML = `
  <div class="kpis">
    <div class="kpi info"><div class="num">${total}</div><div class="lbl">Total en BASE</div></div>
    <div class="kpi ok"><div class="num">${pct}%</div><div class="lbl">Completado</div></div>
    <div class="kpi ok"><div class="num">${ok}</div><div class="lbl">✅ OK</div></div>
    <div class="kpi warn"><div class="num">${diff}</div><div class="lbl">⚠️ Diferencia</div></div>
    <div class="kpi err"><div class="num">${miss}</div><div class="lbl">❌ No capturadas</div></div>
    <div class="kpi purple"><div class="num">${extra}</div><div class="lbl">➕ Extras</div></div>
  </div>

  <section>
    <h2>📍 Progreso por Ubicación</h2>
    <div class="bar-wrap">
      ${ubList.length === 0 ? '<div class="empty-msg">Sin datos</div>' :
        ubList.map(([ub, s]) => {
          const p = s.total > 0 ? Math.round(s.ok / s.total * 100) : 0;
          const color = p === 100 ? '#34a853' : p === 0 ? '#ea4335' : '#fbbc04';
          return `<div class="bar-row">
            <div class="bar-label" title="${ub}">${ub}</div>
            <div class="bar-bg"><div class="bar-fill" style="width:${p}%;background:${color}"></div></div>
            <div class="bar-pct">${p}%</div>
          </div>`;
        }).join('')}
    </div>

    <h2>🔁 Ubicaciones a Recontar (${recontar.length})</h2>
    <div class="table-wrap">
      <table>
        <tr><th>Ubicación</th><th>DUN</th><th>Motivo</th><th>BASE</th><th>Capturado</th></tr>
        ${recontar.length === 0
          ? '<tr><td colspan="5" class="empty-msg">✅ Sin diferencias</td></tr>'
          : recontar.map(r => `<tr>
              <td><b>${r.ubicacion}</b></td>
              <td style="font-size:11px">${r.dun}</td>
              <td>${tagHtml(r.status, r.diff)}</td>
              <td>${r.cantBase}</td>
              <td style="font-weight:bold;color:${r.diff < 0 ? '#ea4335' : r.diff > 0 ? '#1a73e8' : '#34a853'}">${r.cantCap}</td>
            </tr>`).join('')}
      </table>
    </div>

    <h2>📋 Detalle Completo (${filtered.length})</h2>
    <div class="table-wrap">
      <table>
        <tr><th>DUN</th><th>Ubicación</th><th>Estado</th><th>Dif.</th><th>Disp.</th></tr>
        ${filtered.length === 0
          ? '<tr><td colspan="5" class="empty-msg">Sin registros</td></tr>'
          : filtered.map(r => `<tr>
              <td><b style="font-size:11px">${r.dun}</b><br><span style="color:#aaa;font-size:10px">${r.desc}</span></td>
              <td style="font-size:11px">${r.ubicacion}</td>
              <td>${tagHtml(r.status, r.diff)}</td>
              <td style="font-weight:bold;color:${r.diff < 0 ? '#ea4335' : r.diff > 0 ? '#1a73e8' : '#34a853'}">${r.diff > 0 ? '+' : ''}${r.diff}</td>
              <td style="font-size:11px">${r.dispositivos.join(', ') || '—'}</td>
            </tr>`).join('')}
      </table>
    </div>
  </section>`;
}

function tagHtml(s, diff) {
  if (s === 'ok')    return '<span class="tag tag-ok">✅ OK</span>';
  if (s === 'miss')  return '<span class="tag tag-miss">❌ No capturada</span>';
  if (s === 'extra') return '<span class="tag tag-extra">➕ Extra</span>';
  if (s === 'diff')  return `<span class="tag tag-diff">⚠️ ${diff > 0 ? '+' : ''}${diff}</span>`;
  return s;
}

loadData();
</script>

</body>
</html>
