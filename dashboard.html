<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Calyco - Auditoría de Inventario</title>
    <style>
        :root { --blue: #1a73e8; --red: #ea4335; --green: #34a853; --gray: #f8f9fa; }
        body { font-family: sans-serif; background: #eef2f7; margin: 0; }
        header { background: var(--blue); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 20px; }
        .kpi-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .kpi { background: white; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); cursor: pointer; }
        .kpi h2 { margin: 0; font-size: 35px; }
        .kpi.neg { border-bottom: 5px solid var(--red); }
        .kpi.neg h2 { color: var(--red); }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th { background: #f1f3f4; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; }
        .modal-content { background:white; width:90%; max-height:80%; overflow-y:auto; border-radius:10px; padding:20px; }
    </style>
</head>
<body>

<header>
    <h1>Control de Inventario Real-Time</h1>
    <div id="status">Sincronizando...</div>
</header>

<div class="container">
    <div class="kpi-container" id="kpi-box"></div>
    <button onclick="fetchData()" style="padding:10px 20px; cursor:pointer;">🔄 Actualizar Datos</button>
</div>

<div id="modal" class="modal" onclick="this.style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div style="display:flex; justify-content:space-between;">
            <h3>Detalle de Registros</h3>
            <button onclick="document.getElementById('modal').style.display='none'">Cerrar</button>
        </div>
        <table id="detail-table">
            <thead>
                <tr>
                    <th>Ubicación</th>
                    <th>DUN Base</th>
                    <th>DUN Captura</th>
                    <th>Base</th>
                    <th>Captura</th>
                    <th>Dif.</th>
                </tr>
            </thead>
            <tbody id="modal-body"></tbody>
        </table>
    </div>
</div>

<script>
    // PEGA AQUÍ LA URL QUE COPIASTE DE GOOGLE APPS SCRIPT
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw95dL7cWDdpsuiwbqFo_jf1oDnq4cw3tUMRo-6LjgRuyiW0egJwax6TIQXkKtf5zIrmw/exec";

    let base = [], captures = [], analysis = [];

    async function fetchData() {
        document.getElementById('status').innerText = "Cargando...";
        try {
            const [resBase, resCap] = await Promise.all([
                fetch(WEB_APP_URL + "?type=base"),
                fetch(WEB_APP_URL + "?type=captures")
            ]);
            base = await resBase.json();
            captures = await resCap.json();
            process();
        } catch (e) {
            alert("Error al cargar datos. Verifica la URL de la API.");
        }
    }

    function process() {
        // Mapa de capturas por ubicación
        const capMap = {};
        captures.forEach(c => {
            const loc = String(c.Ubicacion).trim().toUpperCase();
            if(!capMap[loc]) capMap[loc] = { cant: 0, duns: [] };
            capMap[loc].cant += parseFloat(c.Cantidad) || 0;
            capMap[loc].duns.push(String(c.DUN).trim());
        });

        // La base es la dueña de la información
        analysis = base.map(b => {
            const loc = String(b.Ubicacion).trim().toUpperCase();
            const dBase = String(b.DUN).trim();
            // Buscamos el valor de la columna "Cantidad" de tu planilla
            const qBase = parseFloat(b.Cantidad) || 0; 
            
            const cap = capMap[loc] || { cant: 0, duns: ["SIN CAPTURA"] };
            const qCap = cap.cant;
            const dCap = cap.duns[0];

            // Si la base tiene DUN pero el capturador puso VACIA, la diferencia es el total de la base en negativo
            let diff = qCap - qBase;
            let status = "OK";

            if (dBase !== "VACIA" && dCap === "VACIA") {
                status = "NEG";
            } else if (diff < 0) {
                status = "NEG";
            } else if (diff > 0) {
                status = "POS";
            }

            return { loc, dBase, dCap, qBase, qCap, diff, status };
        });

        renderKPIs();
        document.getElementById('status').innerText = "Último corte: " + new Date().toLocaleTimeString();
    }

    function renderKPIs() {
        const neg = analysis.filter(a => a.status === "NEG").length;
        const ok = analysis.filter(a => a.status === "OK").length;
        
        document.getElementById('kpi-box').innerHTML = `
            <div class="kpi neg" onclick="showModal('NEG')"><h2>${neg}</h2><p>DIFERENCIAS NEGATIVAS</p></div>
            <div class="kpi" onclick="showModal('OK')"><h2>${ok}</h2><p>REGISTROS CORRECTOS</p></div>
        `;
    }

    function showModal(filter) {
        const list = analysis.filter(a => a.status === filter);
        const html = list.map(a => `
            <tr>
                <td><b>${a.loc}</b></td>
                <td>${a.dBase}</td>
                <td style="color:${a.dCap === 'VACIA' ? 'red' : 'black'}">${a.dCap}</td>
                <td>${a.qBase}</td>
                <td>${a.qCap}</td>
                <td style="color:red; font-weight:bold">${a.diff}</td>
            </tr>
        `).join('');
        document.getElementById('modal-body').innerHTML = html;
        document.getElementById('modal').style.display = 'flex';
    }

    fetchData();
</script>
</body>
</html>
