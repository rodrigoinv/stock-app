<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Inventario Segmentado</title>
    <style>
        /* Reset y Estilos Base */
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:sans-serif;background:#f0f4f8;min-height:100vh;padding-bottom:40px}
        
        /* Header y Barra de Herramientas */
        header{background:#1a73e8;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
        header h1{font-size:17px}
        #last-update{font-size:11px;opacity:0.8}
        
        .toolbar{background:#fff;padding:10px 14px;display:flex;gap:8px;border-bottom:1px solid #e0e0e0;position:sticky;top:48px;z-index:99}
        .toolbar select{padding:7px 10px;border:1px solid #ddd;border-radius:8px;flex:1;font-size:13px}
        
        .btn{border:none;padding:8px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-weight:bold;background:#1a73e8;color:#fff;transition:0.3s}
        .btn:active{transform:scale(0.95)}

        /* KPIs */
        .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:14px}
        .kpi{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center;cursor:pointer;transition:0.2s}
        .kpi:hover{background:#f8f9fa}
        .kpi .num{font-size:28px;font-weight:bold}
        .kpi .lbl{font-size:11px;color:#888;text-transform:uppercase;margin-top:4px}
        
        .kpi.ok .num{color:#34a853}      /* Verde */
        .kpi.neg .num{color:#ea4335}     /* Rojo (Faltante) */
        .kpi.pos .num{color:#fbbc04}     /* Amarillo (Sobrante) */
        .kpi.miss .num{color:#1a73e8}    /* Azul (Pendiente) */

        /* Barra Segmentada */
        .bar-container {background:#fff; border-radius:12px; padding:20px; margin:0 14px 14px; box-shadow:0 1px 4px rgba(0,0,0,.08)}
        .bar-title {font-size:14px; color:#333; margin-bottom:10px; font-weight:bold}
        .stacked-bar {display:flex; height:35px; width:100%; background:#eee; border-radius:8px; overflow:hidden; margin:15px 0}
        .segment {height:100%; display:flex; align-items:center; justify-content:center; color:white; font-size:10px; font-weight:bold; transition:width 0.5s ease}
        
        /* Modal */
        .modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center}
        .modal-bg.open{display:flex}
        .modal{background:#fff;border-radius:14px;width:95%;max-width:900px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden}
        .modal-header{padding:15px;background:#1a73e8;color:#fff;display:flex;justify-content:space-between;align-items:center}
        .modal-body{overflow:auto;padding:15px}
        
        /* Tabla */
        table{width:100%;border-collapse:collapse;font-size:12px}
        th{background:#f8f9fa;padding:10px;text-align:left;border-bottom:1px solid #eee;position:sticky;top:0}
        td{padding:10px;border-bottom:1px solid #f5f5f5}
        .tag{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:bold;color:#fff;display:inline-block}
    </style>
</head>
<body>

<header>
    <h1>📊 Inventario Real-Time</h1>
    <span id="last-update">—</span>
</header>

<div class="toolbar">
    <select id="filter-device" onchange="render()">
        <option value="all">Todos los dispositivos</option>
    </select>
    <button class="btn" onclick="loadData()">🔄 Actualizar</button>
</div>

<div id="content">
    <div style="text-align:center;padding:50px">Cargando aplicación...</div>
</div>

<div class="modal-bg" id="modal-bg">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modal-title">Detalle</h3>
            <button onclick="closeModal()" style="color:white; background:none; border:none; font-size:24px; cursor:pointer">✕</button>
        </div>
        <div class="modal-body">
            <table>
                <thead>
                    <tr>
                        <th>DUN</th>
                        <th>Ubicación</th>
                        <th>Estado</th>
                        <th>Base</th>
                        <th>Cap.</th>
                        <th>Dif.</th>
                    </tr>
                </thead>
                <tbody id="modal-table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURACIÓN ---
    // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
    var API = "https://script.google.com/macros/s/AKfycbw95dL7cWDdpsuiwbqFo_jf1oDnq4cw3tUMRo-6LjgRuyiW0egJwax6TIQXkKtf5zIrmw/exec";
    
    var baseData = [], captureData = [], analysis = [];

    // --- CARGA DE DATOS ---
    async function loadData() {
        const contentDiv = document.getElementById("content");
        contentDiv.innerHTML = "<div style='text-align:center;padding:50px'>⏳ Obteniendo datos de la nube...</div>";
        
        try {
            const [r1, r2] = await Promise.all([
                fetch(API + "?type=base"),
                fetch(API + "?type=captures")
            ]);
            
            baseData = await r1.json();
            captureData = await r2.json();
            
            document.getElementById("last-update").textContent = "Corte: " + new Date().toLocaleTimeString();
            buildDeviceFilter();
            render();
        } catch(e) {
            console.error(e);
            contentDiv.innerHTML = "<div style='text-align:center;padding:50px;color:red'>❌ Error de conexión. Revisa la URL de la API o la conexión a internet.</div>";
        }
    }

    function buildDeviceFilter() {
        const devs = [...new Set(captureData.map(r => r.Dispositivo))].filter(Boolean).sort((a,b)=>a-b);
        const sel = document.getElementById("filter-device");
        sel.innerHTML = "<option value='all'>Todos los dispositivos</option>";
        devs.forEach(d => {
            sel.innerHTML += `<option value="${d}">Dispositivo ${String(d).padStart(2,'0')}</option>`;
        });
    }

    // --- LÓGICA DE ANÁLISIS ---
    function analyze() {
        const devFilter = document.getElementById("filter-device").value;
        const caps = devFilter === "all" ? captureData : captureData.filter(r => String(r.Dispositivo) === devFilter);
        
        // Mapear capturas por Ubicación + DUN para sumar cantidades
        const capMap = {};
        caps.forEach(r => {
            const key = String(r.DUN).trim().toUpperCase() + "||" + String(r.Ubicacion).trim().toUpperCase();
            if(!capMap[key]) capMap[key] = 0;
            capMap[key] += parseFloat(r.Cantidad) || 0;
        });

        // Comparar Base vs Capturas
        analysis = baseData.map(b => {
            const dun = String(b.DUN).trim().toUpperCase();
            const ubic = String(b.Ubicacion).trim().toUpperCase();
            const key = dun + "||" + ubic;
            
            const cantBase = parseFloat(b.Cantidad) || 0;
            const cantCap = capMap.hasOwnProperty(key) ? capMap[key] : 0;
            const diff = cantCap - cantBase;
            
            let status = "miss"; // Por defecto: No capturado
            if (capMap.hasOwnProperty(key)) {
                if (Math.abs(diff) < 0.01) status = "ok";
                else if (diff < 0) status = "neg"; // Faltante
                else status = "pos"; // Sobrante
            }
            
            return { 
                DUN: dun, 
                Ubicacion: ubic, 
                Cantidad: cantBase, 
                cantCap: cantCap, 
                diff: diff, 
                status: status 
            };
        });
    }

    // --- RENDERIZADO ---
    function render() {
        analyze();
        const total = analysis.length;
        if(total === 0) return;

        const ok = analysis.filter(r => r.status === "ok").length;
        const neg = analysis.filter(r => r.status === "neg").length;
        const pos = analysis.filter(r => r.status === "pos").length;
        const miss = analysis.filter(r => r.status === "miss").length;

        const pOk = (ok/total*100).toFixed(1);
        const pNeg = (neg/total*100).toFixed(1);
        const pPos = (pos/total*100).toFixed(1);
        const pMiss = (miss/total*100).toFixed(1);

        document.getElementById("content").innerHTML = `
            <div class="kpis">
                <div class="kpi ok" onclick="openModal('ok')"><div class="num">${ok}</div><div class="lbl">Correctos</div></div>
                <div class="kpi neg" onclick="openModal('neg')"><div class="num">${neg}</div><div class="lbl">Faltantes (-)</div></div>
                <div class="kpi pos" onclick="openModal('pos')"><div class="num">${pos}</div><div class="lbl">Sobrantes (+)</div></div>
                <div class="kpi miss" onclick="openModal('miss')"><div class="num">${miss}</div><div class="lbl">Pendientes</div></div>
            </div>

            <div class="bar-container">
                <p class="bar-title">Distribución de Inventario</p>
                <div class="stacked-bar">
                    <div class="segment" style="width:${pOk}%; background:#34a853">${ok>0?pOk+'%':''}</div>
                    <div class="segment" style="width:${pNeg}%; background:#ea4335">${neg>0?pNeg+'%':''}</div>
                    <div class="segment" style="width:${pPos}%; background:#fbbc04">${pos>0?pPos+'%':''}</div>
                    <div class="segment" style="width:${pMiss}%; background:#1a73e8">${miss>0?pMiss+'%':''}</div>
                </div>
                <div style="display:flex; justify-content:space-between; font-size:10px; color:#666">
                    <span>Total Registros: ${total}</span>
                    <span>Exactitud: ${pOk}%</span>
                </div>
            </div>
        `;
    }

    // --- MODAL ---
    function openModal(filter) {
        const data = analysis.filter(r => r.status === filter);
        const title = {ok: "Correctos", neg: "Faltantes (Diferencia Negativa)", pos: "Sobrantes (Diferencia Positiva)", miss: "Pendientes"};
        
        document.getElementById("modal-title").textContent = "Detalle: " + title[filter];
        document.getElementById("modal-table-body").innerHTML = data.map(r => `
            <tr>
                <td>${r.DUN}</td>
                <td>${r.Ubicacion}</td>
                <td>
                    <span class="tag" style="background:${r.status==='ok'?'#34a853':r.status==='neg'?'#ea4335':r.status==='pos'?'#fbbc04':'#1a73e8'}">
                        ${r.status.toUpperCase()}
                    </span>
                </td>
                <td>${r.Cantidad}</td>
                <td>${r.cantCap}</td>
                <td style="font-weight:bold; color:${r.diff < 0 ? '#ea4335' : (r.diff > 0 ? '#fbbc04' : '#34a853')}">
                    ${r.diff > 0 ? '+' + r.diff : r.diff}
                </td>
            </tr>
        `).join("");
        
        document.getElementById("modal-bg").classList.add("open");
    }

    function closeModal() {
        document.getElementById("modal-bg").classList.remove("open");
    }

    // Iniciar
    loadData();
</script>
</body>
</html>
